<style>

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
}

body {
    background: #eef2f7;
    font-family: Arial, Helvetica, sans-serif;
    color: #071f3b;
}

.card {
    width: calc(100% - 18px);
    max-width: 450px;
    margin: 3px auto;
    background: #ffffff;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    min-height: calc(100vh - 6px);
}

.header {
    background: linear-gradient(135deg,#071f3b 0%,#123e68 100%);
    color: #ffffff;
    text-align: center;
    padding: 20px 15px 19px;
}

.logo-box {
    width: 110px;
    height: 80px;
    margin: 0 auto 20px;
    background: #ffffff;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-box img {
    width: 90px;
    max-height: 65px;
    object-fit: contain;
}

.company {
    font-size: 29px;
    font-weight: 700;
    line-height: 1.15;
}

.tagline {
    margin-top: 7px;
    font-size: 14px;
    color: #e6edf5;
}

.profile {
    text-align: center;
    padding: 28px 20px 10px;
}

.name {
    margin: 0;
    font-size: 29px;
    font-weight: 700;
    color: #071f3b;
}

.designation {
    margin-top: 5px;
    font-size: 18px;
    font-weight: 700;
    color: #2868a1;
}

.phone {
    margin-top: 25px;
    font-size: 16px;
}

.phone-icon {
    color: #e83e8c;
    font-size: 21px;
    margin-right: 8px;
}

.buttons {
    padding: 10px 25px 25px;
}

.button {
    width: 100%;
    min-height: 46px;
    margin-top: 12px;
    border: 0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    font-family: Arial, Helvetica, sans-serif;
    cursor: pointer;
}

.button i { font-size: 18px; }

.call {
    background: #0b355d;
    color: #ffffff;
    box-shadow: 0 4px 10px rgba(11,53,93,0.18);
}

.secondary,
.linkedin {
    background: #edf2f7;
    color: #071f3b;
}

.footer {
    border-top: 1px solid #e5e7eb;
    text-align: center;
    padding: 20px 10px 16px;
    color: #667085;
    font-size: 12px;
}

@media (max-width: 380px) {
    .company { font-size: 25px; }
    .name { font-size: 26px; }
    .buttons {
        padding-left: 18px;
        padding-right: 18px;
    }
}
