<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Deepak Raina | Frontstax Solutions</title>

<meta name="description"
      content="Deepak Raina - Founder & CEO | Frontstax Solutions">

<!-- Font Awesome -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: #eef2f7;
    font-family: Arial, Helvetica, sans-serif;
    color: #071f3b;
}

.card {
    width: calc(100% - 18px);
    max-width: 450px;
    margin: 3px auto;

    background: #ffffff;

    border-radius: 22px;

    overflow: hidden;

    box-shadow: 0 8px 25px rgba(0,0,0,0.12);

    min-height: calc(100vh - 6px);
}


/* ================= HEADER ================= */

.header {

    background:
        linear-gradient(
            135deg,
            #071f3b 0%,
            #123e68 100%
        );

    color: #ffffff;

    text-align: center;

    padding: 20px 15px 19px;
}


.logo-box {

    width: 110px;
    height: 80px;

    margin: 0 auto 20px;

    background: #ffffff;

    border-radius: 18px;

    display: flex;

    align-items: center;

    justify-content: center;
}


.logo-box img {

    width: 90px;

    max-height: 65px;

    object-fit: contain;
}


.company {

    font-size: 29px;

    font-weight: 700;

    line-height: 1.15;
}


.tagline {

    margin-top: 7px;

    font-size: 14px;

    color: #e6edf5;
}


/* ================= PROFILE ================= */

.profile {

    text-align: center;

    padding: 28px 20px 10px;
}


.name {

    margin: 0;

    font-size: 29px;

    font-weight: 700;

    color: #071f3b;
}


.designation {

    margin-top: 5px;

    font-size: 18px;

    font-weight: 700;

    color: #2868a1;
}


.phone {

    margin-top: 25px;

    font-size: 16px;

    color: #071f3b;
}


.phone-icon {

    color: #e83e8c;

    font-size: 21px;

    margin-right: 8px;
}


.additional {

    margin-top: 8px;

    font-size: 14px;

    color: #667085;
}


/* ================= BUTTONS ================= */

.buttons {

    padding: 10px 25px 25px;
}


.button {

    width: 100%;

    min-height: 46px;

    margin-top: 12px;

    border: 0;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 9px;

    text-decoration: none;

    font-size: 16px;

    font-weight: 700;

    font-family: Arial, Helvetica, sans-serif;

    cursor: pointer;
}


.button i {
    font-size: 18px;
}


.call {

    background: #0b355d;

    color: #ffffff;

    box-shadow:
        0 4px 10px rgba(11,53,93,0.18);
}


.secondary {

    background: #edf2f7;

    color: #071f3b;
}


.linkedin {

    background: #edf2f7;

    color: #071f3b;
}


/* ================= FOOTER ================= */

.footer {

    border-top: 1px solid #e5e7eb;

    text-align: center;

    padding: 20px 10px 16px;

    color: #667085;

    font-size: 12px;
}


/* ================= MOBILE ================= */

@media (max-width: 380px) {

    .company {
        font-size: 25px;
    }

    .name {
        font-size: 26px;
    }

    .buttons {
        padding-left: 18px;
        padding-right: 18px;
    }

}

</style>

</head>


<body>

<div class="card">


    <!-- HEADER -->

    <div class="header">

        <div class="logo-box">

            <img
                src="../../assets/logo.png"
                alt="Frontstax Solutions">

        </div>


        <div class="company">

            Frontstax Solutions

        </div>


        <div class="tagline">

            Your Partner In Digital Innovation

        </div>

    </div>


    <!-- PROFILE -->

    <div class="profile">

        <h1 class="name">

            Deepak Raina

        </h1>


        <div class="designation">

            Founder & CEO

        </div>


        <div class="phone">

            <span class="phone-icon">
                <i class="fa-solid fa-mobile-screen-button"></i>
            </span>

            +971 55 380 5362

        </div>


        <div class="additional">
            Additional: +91 98936 64400
        </div>


    </div>


    <!-- BUTTONS -->

    <div class="buttons">


        <!-- CALL -->

        <a
            class="button call"
            href="tel:+971553805362">

            <i class="fa-solid fa-mobile-screen-button"></i>
            Call Now

        </a>


        <!-- WHATSAPP -->

        <a
            class="button secondary"
            href="https://wa.me/971553805362"
            target="_blank"
            rel="noopener">

            <i class="fa-brands fa-whatsapp"></i>
            WhatsApp

        </a>


        <!-- SAVE CONTACT -->

        <a
            class="button secondary"
            href="vcard.vcf">

            <i class="fa-solid fa-address-card"></i>
            Save Contact

        </a>


        <!-- EMAIL -->

        <a
            class="button secondary"
            href="mailto:deepak.raina@frontstaxsolutions.com">

            <i class="fa-solid fa-envelope"></i>
            Email

        </a>

        <!-- LINKEDIN -->

<a
    class="button linkedin"
    href="https://www.linkedin.com/in/deepak-raina-52319a19"
    target="_blank"
    rel="noopener">

    <i class="fa-brands fa-linkedin-in"></i>
    LinkedIn

</a>


    </div>


    <!-- FOOTER -->

    <div class="footer">

        © Frontstax Solutions

    </div>


</div>

</body>

</html>
