<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frontstax Solutions | Staff Directory</title>

    <meta name="description"
          content="Frontstax Solutions digital staff directory">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef2f7;
            color: #172033;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 18px 50px rgba(11, 31, 58, 0.15);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: linear-gradient(135deg, #071b33, #123e68);
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            margin: 20px 0 8px;
            color: #0b1f3a;
        }

        .subtitle {
            color: #667085;
            font-size: 15px;
        }

        .message {
            margin-top: 25px;
            line-height: 1.6;
            color: #667085;
        }

        .website {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #0b1f3a;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #98a2b3;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                FS
            </div>

            <h1>Frontstax Solutions</h1>

            <div class="subtitle">
                Your Partner in Digital Innovation
            </div>

            <div class="message">
                Welcome to the Frontstax Solutions digital staff directory.
                <br><br>
                Please use the individual QR code provided by your
                Frontstax Solutions team member to access their
                digital business card.
            </div>

            <a class="website"
               href="https://frontstaxsolutions.com">
                Visit Website
            </a>

            <div class="footer">
                © Frontstax Solutions
            </div>

        </div>

    </div>

</body>

</html>
